- insert:
    - id: dsh-dafeiyu-pro
      name: dsh-dafeiyu-pro
      config:
        enabled: true
        scale: 1
        bubbleScale: 1
        activityLevel: normal
        reducedMotion: false
        soundEnabled: true
        soundStates:
          - SUCCESS
          - ERROR
        bubbleMode: always
        bubbleStates:
          - SUCCESS
          - ERROR
          - WAITING
        includeSubagents: false
        webOverlay: false
        clientTarget: auto
        balanceEnabled: true
        balanceSource: auto
        # ── 语音（本 fork 新增）──────────────────────────────────
        # 默认关。开了会 spawn 一个 voice_service.py 子进程。
        # 需要 apikey.txt 里有 qwen（ASR/TTS/对话）和 bochaai（搜索）。
        voiceEnabled: false
        voiceWakeWord: 大肥鱼
        voiceTts: Cherry
        voiceLlm: qwen-flash
        voiceAgent: true
        voiceAskPermission: true
        # shared=共享（和 DSH 语音输入共存）/ exclusive=WDM-KS 独占
        voiceAudioMode: shared
        voicePython: python
        voiceModelDir: ''
